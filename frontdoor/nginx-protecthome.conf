# nginx-protecthome.conf — an add-on to nginx's own service on Garcks-PC: nginx cannot see /home at all.
# In:  nothing; systemd reads it when nginx starts.
# Out: /home, /root and /run/user are invisible to nginx, so Planet's world files and Jamie's keys are out of its reach.
# Decision: W2-c — the internet-facing programs run on their own accounts and cannot reach Jamie's home folder.
# Built in W2 — the front door (24 Sep 2026). Installed as /etc/systemd/system/nginx.service.d/protecthome.conf (RUNBOOK.md step 3).

[Service]
ProtectHome=yes
