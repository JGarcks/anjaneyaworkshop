# nginx.conf — the front door: the only thing between the internet and Planet's engine on Garcks-PC.
# In:  requests from the named tunnel (cloudflared on this machine), on 127.0.0.1:8090 only.
# Out: Planet's own replies from 127.0.0.1:8080, compressed, read-only, rate-limited per visitor; the viewer's page and the
#      grid held one second here, the live numbers not held here at all (Cloudflare's second is the only hold on them).
# Decision: WS · D1 (a read-only door, the engine untouched), WS · D4 (one second at the edge), W2-a (only our pages may frame it),
#   W4-e (the door stopped holding the live numbers: a picture every ~1.4 s instead of ~2.1 s).
# Built in W2 — the front door (24 Sep 2026); W4 — the live numbers pass through. Installed as /etc/nginx/conf.d/anjaneya-frontdoor.conf (RUNBOOK.md step 3).
#
# This file sits inside nginx's own http { } block (Debian/Mint's nginx.conf includes conf.d/*.conf),
# so the first three pieces below — the memory, the rate-limit table and the header rules — are shared settings,
# and the server { } block is the door itself.

# The one-second memory: replies kept on disk under /var/cache/nginx, forgotten after a day unused.
proxy_cache_path /var/cache/nginx/planet levels=1:2 keys_zone=planet:10m max_size=200m inactive=1d use_temp_path=off;

# The rate limit: one bucket per visitor. Cloudflare's edge answers most requests itself, so only its misses
# arrive here; a normal viewer, even with no edge cache at all, asks about 12 times a second (meta every 125 ms
# plus a field refresh), so 20 a second with a burst of 40 never touches a real visitor.
limit_req_zone $binary_remote_addr zone=visitors:10m rate=20r/s;

# How long each reply may be kept, by what it is and whether it worked. The grid (the cells' positions) only
# changes if Planet's resolution changes, so it is kept a day; everything else one second at Cloudflare's edge
# (s-maxage=1) and not at all in the browser (max-age=0): three stacked one-second holds (door, edge, browser)
# sent pictures up to 3.2 s apart and the viewer jumps past 3 s (Jamie's walk, W2). A "not found" likewise;
# anything that went wrong (429, 502, 504…) is never kept, so one visitor's refusal or a moment when the engine
# is down is never handed to anyone else.
map "$status $uri" $door_cache_control {
    "~^200 /api/grid$"   "public, max-age=86400";
    "~^(200|404) "       "public, max-age=0, s-maxage=1";
    default              "no-store";
}

# The live numbers are not held here at all (W4-e): nginx counts its one second in whole seconds, so it held each
# copy 1–2 s, and a third of Cloudflare's one-second refreshes came back with the picture it already had (W4's
# probe: 14 of 42). Cloudflare's own one second does the holding; the engine answers each refresh itself — about
# one request per address per second per Cloudflare location with a viewer. The house's upload is unchanged.
map $uri $door_live {
    "~^/api/(meta|field/|events|log)"   1;
    default                            0;
}

# The access log: what was asked, whether the memory answered (HIT) or the engine did (MISS/EXPIRED/UPDATING),
# how many bytes went up the house's line, and how long it took. No visitor addresses — nothing here is analytics.
log_format door '$time_iso8601 $request_method $uri $status $upstream_cache_status $bytes_sent $request_time';

upstream planet_engine {
    server 127.0.0.1:8080;   # planet.service, the live planet (Planet's brief §8: only nginx talks to it)
    keepalive 4;              # the engine runs four worker threads; reuse connections rather than open one per request
}

server {
    listen 127.0.0.1:8090;    # only the tunnel on this machine can reach the door; nothing listens on the LAN
    server_name planet.anjaneyaworkshop.co.uk;
    server_tokens off;

    access_log /var/log/nginx/anjaneya-frontdoor.log door;

    # The visitor's real address comes from Cloudflare's header, trusted only because the tunnel runs on this machine.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Read-only (CLAUDE.md rule 11): anything but GET or HEAD is refused before the engine sees it.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    limit_req zone=visitors burst=40 nodelay;
    limit_req_status 429;

    # Compression for everything the engine sends; fields are raw numbers and shrink by a sixth to a half.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json application/octet-stream text/javascript;

    # The memory, keyed on the path alone: the engine ignores anything after "?" (Planet's server.rs), so
    # "/api/meta?anything" is the same reply, and a query string can never force the engine to work.
    proxy_cache planet;
    proxy_cache_key $uri;
    # One second here for everything, the grid included: the engine answers the grid cheaply and only on an
    # edge miss, and it means a change of resolution needs a purge at Cloudflare only (Active-Work, held triggers).
    proxy_cache_valid 200 404 1s;
    # …except the live numbers, which pass straight through (the map above; X-Cache-Status says BYPASS).
    proxy_cache_bypass $door_live;
    proxy_no_cache $door_live;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    # Simultaneous misses on what is held collapse into one fetch; while that fetch runs, the others get the copy just
    # expired. (The live numbers are not held, so each Cloudflare refresh reaches the engine; Cloudflare collapses its own.)
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_cache_use_stale updating;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Headers on every reply. Cache-Control is the door's own (the engine's "no-store" is removed above);
    # X-Planet-Tick passes through untouched, the restart signal (CLAUDE.md rule 12).
    add_header Cache-Control $door_cache_control always;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Allow-Origin "https://anjaneyaworkshop.co.uk" always;
    add_header Access-Control-Expose-Headers "X-Planet-Tick" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://anjaneyaworkshop.co.uk" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The addresses Planet serves, and nothing else (from Planet's server.rs). Everything else is "not found"
    # at the door, so an unknown path never reaches the engine.
    location ~ ^/(index\.html|viewer\.js|api/(meta|grid|log|events|field/[a-z0-9_]+|cell/[0-9]+))?$ {
        proxy_pass http://planet_engine;
    }

    location / {
        return 404;
    }
}
